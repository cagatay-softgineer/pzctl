name: release

# Every merge to master publishes a release.
#
# If the merged commit already changed __version__ (a deliberate MINOR or MAJOR
# bump) that version is released as-is. Otherwise the patch number is bumped
# automatically and committed back, so a release always happens.
#
# Note this means docs-only and test-only merges also publish, and the panel's
# update check will announce them to users. Tying releases to __version__
# changes instead would keep those quiet.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Both the patch-bump commit and the annotated tag need an identity.
      # It lives here rather than inside the bump step because that step exits
      # early on a deliberate version bump, which used to leave the tag step
      # with no identity and fail the release.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read the version
        id: version
        run: |
          VERSION=$(python -c "import pzctl; print(pzctl.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "pzctl/__init__.py declares $VERSION"

      # An explicit bump in the merged PR wins. Only when the current version
      # is already published does this invent the next patch number.
      - name: Bump the patch version if this one is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION was set deliberately and is unreleased - releasing it"
            echo "release=go" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "v$VERSION is already released - bumping to $NEXT"

          sed -i -E "s/__version__ = \"[^\"]+\"/__version__ = \"$NEXT\"/" pzctl/__init__.py
          grep -n "__version__" pzctl/__init__.py

          git add pzctl/__init__.py
          git commit -m "Bump version to $NEXT [skip ci]"
          git push origin HEAD:master

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "release=go" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.check.outputs.release == 'go'
        run: python -m unittest discover -s tests -t .

      - name: Check panel JavaScript parses
        if: steps.check.outputs.release == 'go'
        run: |
          # Every panel script, not just app.js - a new file would
          # otherwise ship unchecked.
          for f in pzctl/web/*.js; do echo "checking $f"; node --check "$f"; done

      # Only the files a user drops into their server directory. Notably no
      # tests/, no .github/, and no pzctl.json - that one holds their secrets.
      - name: Build the drop-in zip
        if: steps.check.outputs.release == 'go'
        run: |
          VERSION="${{ steps.check.outputs.version || steps.version.outputs.version }}"
          STAGE="dist/pzctl-$VERSION"
          mkdir -p "$STAGE"
          cp -r pzctl "$STAGE/"
          find "$STAGE/pzctl" -name '__pycache__' -type d -prune -exec rm -rf {} +
          cp PZ-Control.bat pz-control.sh pzctl.json.example README.md LICENSE CHANGELOG.md "$STAGE/"
          chmod +x "$STAGE/pz-control.sh"
          (cd dist && zip -r "pzctl-$VERSION.zip" "pzctl-$VERSION")
          echo "--- zip contents ---"
          unzip -l "dist/pzctl-$VERSION.zip"

      - name: Tag and publish
        if: steps.check.outputs.release == 'go'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.check.outputs.version || steps.version.outputs.version }}"
          TAG="${{ steps.check.outputs.tag || steps.version.outputs.tag }}"
          git tag -a "$TAG" -m "pzctl $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            "dist/pzctl-$VERSION.zip" \
            --title "$TAG" \
            --generate-notes
